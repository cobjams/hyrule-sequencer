<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <radialGradient id="mixerBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c10" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="sliderTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Cinzel', Georgia, serif; font-weight: 700; }
    .ui-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono-text { font-family: 'SF Mono', Monaco, Consolas, monospace; }
  </style>

  <!-- Modal Dialog Container -->
  <rect width="960" height="480" rx="16" fill="url(#mixerBg)"/>
  <rect width="958" height="478" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Modal Header -->
  <rect x="0" y="0" width="960" height="60" rx="16" fill="#1e293b" fill-opacity="0.7"/>
  <line x1="0" y1="60" x2="960" y2="60" stroke="#334155" stroke-width="1.5"/>

  <!-- Tabs -->
  <g transform="translate(32, 14)">
    <!-- About Tab (Inactive) -->
    <rect x="0" y="0" width="90" height="34" rx="6" fill="transparent"/>
    <text x="45" y="22" fill="#94a3b8" class="ui-text" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">ABOUT</text>

    <!-- Sound Tab (Active) -->
    <rect x="100" y="0" width="96" height="34" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="148" y="22" fill="#4ade80" class="ui-text" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SOUND</text>
  </g>

  <!-- Close Button -->
  <text x="920" y="36" fill="#94a3b8" class="ui-text" font-size="18" font-weight="bold">✕</text>

  <!-- Section Title -->
  <text x="32" y="98" fill="#f8fafc" class="title-text" font-size="20">N64 DSP SOUND MIXER</text>
  <text x="32" y="118" fill="#94a3b8" class="ui-text" font-size="12">Real-time Web Audio DSP reconstruction of Nintendo 64 Reality Coprocessor audio characteristics</text>

  <!-- Presets Row -->
  <g transform="translate(32, 136)">
    <!-- Preset 1: N64 Warmth (Active) -->
    <rect x="0" y="0" width="130" height="32" rx="6" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="65" y="20" fill="#4ade80" class="ui-text" font-size="12" font-weight="700" text-anchor="middle">★ N64 Warmth</text>

    <!-- Preset 2: Concert Hall -->
    <rect x="142" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="207" y="20" fill="#cbd5e1" class="ui-text" font-size="12" font-weight="600" text-anchor="middle">Concert Hall</text>

    <!-- Preset 3: Vintage CRT -->
    <rect x="284" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="349" y="20" fill="#cbd5e1" class="ui-text" font-size="12" font-weight="600" text-anchor="middle">Vintage CRT</text>

    <!-- Preset 4: Crisp Studio -->
    <rect x="426" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="491" y="20" fill="#cbd5e1" class="ui-text" font-size="12" font-weight="600" text-anchor="middle">Crisp Studio</text>
  </g>

  <!-- Sliders 2-Column Grid -->
  <!-- Column 1 -->
  <!-- Slider 1: Warmth (Lowpass) -->
  <g transform="translate(32, 195)">
    <rect width="430" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#e2e8f0" class="ui-text" font-size="13" font-weight="600">Warmth (N64 Lowpass)</text>
    <text x="414" y="24" fill="#4ade80" class="mono-text" font-size="13" font-weight="700" text-anchor="end">13.5 kHz</text>
    <!-- Track -->
    <rect x="16" y="38" width="398" height="6" rx="3" fill="#334155"/>
    <rect x="16" y="38" width="250" height="6" rx="3" fill="url(#sliderTrack)"/>
    <circle cx="266" cy="41" r="8" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="62" fill="#64748b" class="ui-text" font-size="10">Filters digital sample aliasing to emulate N64 analog DAC warmth</text>
  </g>

  <!-- Slider 2: Treble / Shrill Cut -->
  <g transform="translate(32, 282)">
    <rect width="430" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#e2e8f0" class="ui-text" font-size="13" font-weight="600">Treble / Shrill Cut</text>
    <text x="414" y="24" fill="#4ade80" class="mono-text" font-size="13" font-weight="700" text-anchor="end">0.0 dB</text>
    <rect x="16" y="38" width="398" height="6" rx="3" fill="#334155"/>
    <rect x="16" y="38" width="280" height="6" rx="3" fill="url(#sliderTrack)"/>
    <circle cx="296" cy="41" r="8" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="62" fill="#64748b" class="ui-text" font-size="10">Attenuates high-octave piercing frequencies on lead winds &amp; brass</text>
  </g>

  <!-- Slider 3: Reverb Ambiance -->
  <g transform="translate(32, 369)">
    <rect width="430" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#e2e8f0" class="ui-text" font-size="13" font-weight="600">Reverb Ambiance</text>
    <text x="414" y="24" fill="#4ade80" class="mono-text" font-size="13" font-weight="700" text-anchor="end">55%</text>
    <rect x="16" y="38" width="398" height="6" rx="3" fill="#334155"/>
    <rect x="16" y="38" width="220" height="6" rx="3" fill="url(#sliderTrack)"/>
    <circle cx="236" cy="41" r="8" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="62" fill="#64748b" class="ui-text" font-size="10">Acoustic concert hall impulse response spatial simulation</text>
  </g>

  <!-- Column 2 -->
  <!-- Slider 4: Stereo Chorus (CC#93) -->
  <g transform="translate(498, 195)">
    <rect width="430" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#e2e8f0" class="ui-text" font-size="13" font-weight="600">Stereo Chorus (CC#93)</text>
    <text x="414" y="24" fill="#4ade80" class="mono-text" font-size="13" font-weight="700" text-anchor="end">50%</text>
    <rect x="16" y="38" width="398" height="6" rx="3" fill="#334155"/>
    <rect x="16" y="38" width="200" height="6" rx="3" fill="url(#sliderTrack)"/>
    <circle cx="216" cy="41" r="8" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="62" fill="#64748b" class="ui-text" font-size="10">Emulates N64 hardware microcode spatial chorus expansion</text>
  </g>

  <!-- Slider 5: Orchestral Stereo Stage -->
  <g transform="translate(498, 282)">
    <rect width="430" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#e2e8f0" class="ui-text" font-size="13" font-weight="600">Orchestral Stereo Stage</text>
    <text x="414" y="24" fill="#4ade80" class="mono-text" font-size="13" font-weight="700" text-anchor="end">100%</text>
    <rect x="16" y="38" width="398" height="6" rx="3" fill="#334155"/>
    <rect x="16" y="38" width="265" height="6" rx="3" fill="url(#sliderTrack)"/>
    <circle cx="281" cy="41" r="8" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="62" fill="#64748b" class="ui-text" font-size="10">Nintendo EAD orchestral seating pan distribution width</text>
  </g>

  <!-- Slider 6: Master Volume -->
  <g transform="translate(498, 369)">
    <rect width="430" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#e2e8f0" class="ui-text" font-size="13" font-weight="600">Master Volume</text>
    <text x="414" y="24" fill="#4ade80" class="mono-text" font-size="13" font-weight="700" text-anchor="end">-2.0 dB</text>
    <rect x="16" y="38" width="398" height="6" rx="3" fill="#334155"/>
    <rect x="16" y="38" width="350" height="6" rx="3" fill="url(#sliderTrack)"/>
    <circle cx="366" cy="41" r="8" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
    <text x="16" y="62" fill="#64748b" class="ui-text" font-size="10">Web Audio master bus headroom limiter and output gain</text>
  </g>
</svg>
